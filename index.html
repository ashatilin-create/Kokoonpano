<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#187A4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lean-vuoro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#E3E9E6; --ink:#131C19; --ink2:#4B5B55; --line:#CBD5D0;
  --c-work:#187A4E; --c-prep:#2A78A8; --c-log:#9A6200; --c-wait:#C7432B; --c-defect:#9B2A66; --c-misc:#6C4FB3; --c-break:#5F6C67; --c-area:#0E7C86; --c-search:#C25E14; --c-over:#7A5230; --c-pack:#4E7D1E; --c-kit:#3D6FB0; --c-shelf:#8A6A12; --c-check:#4F6D7A;
  --shadow:0 1px 0 rgba(19,28,25,.05),0 8px 20px -14px rgba(19,28,25,.35);
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --surface:#171F1C; --surface2:#212B27; --ink:#E9F0EC; --ink2:#97A9A1; --line:#2C3934; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --surface:#171F1C; --surface2:#212B27; --ink:#E9F0EC; --ink2:#97A9A1; --line:#2C3934; --shadow:none;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font)}
body{margin:0;padding-inline:16px;padding-block:14px 112px;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
main,.top,.tabs-in{max-width:760px;margin-inline:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h3{margin:0;font-size:22px;line-height:1.2}
h3 span{font-size:14px;font-weight:400;color:var(--ink2);margin-left:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:14px;flex-wrap:wrap}
.brand{font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sub{font-size:13px;color:var(--ink2);white-space:nowrap}
.hd-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--c-work)}
.chip.err{color:var(--c-wait)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:5px 11px;font-size:12px;font-weight:700;color:var(--ink2);background:var(--surface2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.band{background:var(--c);color:#fff;border-radius:16px;padding:16px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:end;box-shadow:var(--shadow)}
.band .name{font-size:28px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
.band .fi{font-size:14px;opacity:.9;margin-top:2px}
.band .timer{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.band .meta{grid-column:1/-1;display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:500}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.22)}
.band .lnks{margin-left:auto;display:flex;gap:6px 16px;flex-wrap:wrap}
.band .lnks .lnk{margin-left:0}
.lnk[aria-pressed="true"]{font-weight:700}
.lnk{color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:14px;margin-left:auto;font-weight:500}

.ctx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ctxage{font-size:12px;color:var(--ink2);margin:6px 2px 0}
.ctxage.w{color:var(--c-log);font-weight:700}
.field label{display:block;font-size:12px;color:var(--ink2);margin:0 0 4px 2px}
.field input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}

.sheets{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.sheets .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 10px;font-size:14px;color:var(--ink2)}
.sheets .line b{font-family:var(--mono);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.bigbtn{width:100%;min-height:72px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:22px;font-weight:700;letter-spacing:-.01em}
.bigbtn:active{transform:scale(.99)}
.bigbtn small{display:block;font-size:13px;font-weight:500;opacity:.75}
.bigbtn.sm{min-height:48px;font-size:17px}
.mini{font-size:14px;font-weight:600;color:var(--ink2);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.mini[disabled]{opacity:.45;cursor:default}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:559px){.grid .sb:last-child:nth-child(odd){grid-column:1/-1;min-height:64px}}
.nlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.nlist li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px}
.nlist .tm{font-family:var(--mono);font-size:13px;color:var(--ink2);padding-top:2px}
.nlist small{grid-column:2;color:var(--ink2);font-size:13px}
.sb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;min-height:92px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;box-shadow:var(--shadow)}
.sb .dot{width:14px;height:14px;border-radius:4px;background:var(--c);margin-bottom:8px}
.sb .n{font-weight:600;font-size:17px;line-height:1.15}
.sb .f{font-size:13px;color:var(--ink2)}
.sb .cl{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}
.sb[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.sb[aria-pressed="true"] .f,.sb[aria-pressed="true"] .cl{color:rgba(255,255,255,.88)}
.sb[aria-pressed="true"] .dot{background:#fff}
.endrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.endrow button{padding:14px 10px;border-radius:12px;border:1px solid var(--line);font-weight:600;color:var(--ink2);font-size:15px;line-height:1.2}
.endrow button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.card h4{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.start .field{margin-top:10px}
.start p{margin:6px 0 14px;color:var(--ink2);font-size:15px}
.note-demo{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2);color:var(--ink2);font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:12px;border-radius:12px;background:var(--surface2)}
.kpi .kl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.kpi b{display:block;font-family:var(--mono);font-size:30px;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink2);font-size:12px}
.strip{display:flex;height:40px;border-radius:8px;overflow:hidden;background:var(--surface2)}
.strip i{display:block;height:100%;background:var(--c);border-right:1px solid var(--surface);min-width:2px}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:6px}
.leg{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.leg li{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;font-size:15px}
.leg .sw{width:14px;height:14px;border-radius:4px;background:var(--c)}
.leg .t{font-family:var(--mono);font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.leg .p{font-family:var(--mono);font-size:14px;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.wklegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink2)}
.wklegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.par{display:grid;gap:12px}
.par .r1{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.par .r1 span:last-child{font-family:var(--mono);font-size:14px;color:var(--ink2);white-space:nowrap}
.par small{color:var(--ink2);font-size:12px;margin-left:6px}
.par .tr{height:10px;border-radius:5px;background:var(--surface2);margin-top:5px;overflow:hidden}
.par .tr i{display:block;height:100%;background:var(--c);border-radius:5px}
.muted{color:var(--ink2);font-size:14px}
.rowh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.danger{margin-top:16px;color:var(--c-wait);font-weight:600;font-size:14px;padding:8px 0}
.warn{border:2px solid var(--c-log);margin-top:0;margin-bottom:12px}
.warn h4{color:var(--c-log)}
.warn p{margin:0 0 10px;font-size:15px}
.warn .two{margin-top:12px}

.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:12px;border-radius:12px;background:var(--surface2);width:100%}
.row .a{font-weight:600}
.row .b{font-family:var(--mono);font-size:13px;color:var(--ink2);text-align:right}
.row .c{font-size:13px;color:var(--ink2)}
.row .d{font-family:var(--mono);font-size:13px;text-align:right}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{padding:12px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:15px}
.btns button[disabled]{opacity:.45;cursor:default}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs-in{display:flex;gap:8px}
.tabs button{flex:1;padding:10px 6px;border-radius:10px;font-weight:600;font-size:15px;line-height:1.15;min-height:44px}
.tabs button small{display:block;font-size:11px;font-weight:500;opacity:.7}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}

#modal .ov{position:fixed;inset:0;background:rgba(8,12,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
#modal .md{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.q{margin:6px 0 4px;color:var(--ink2);font-size:14px}
.rb{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:15px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);margin-top:8px;font-size:17px;font-weight:500}
.rb small{color:var(--ink2);font-size:13px;font-weight:400;text-align:right}
.rb.ghost{background:none}
.rb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rb[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.noterow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:10px}
.noterow input{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.noterow .bigbtn{width:auto;padding:0 18px;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two button{padding:14px;border-radius:12px;font-weight:700;font-size:16px;border:1px solid var(--line)}
.two .ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}

#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:25;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:14px;font-weight:500;max-width:640px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.toast button{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.trg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:12px}
.tk{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px 9px;border-radius:12px;border:1.5px dashed var(--line);min-height:80px;background:none;min-width:0}
.tk b{font-family:var(--mono);font-size:18px;letter-spacing:-.02em}
.tk .s{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.tk .w{margin-top:auto;font-family:var(--mono);font-size:12px}
.tk.on{background:var(--c-work);border:1.5px solid var(--c-work);color:#fff}
.tk.on.late{background:var(--c-log);border-color:var(--c-log)}
.tk.on .s{color:#fff;opacity:.92}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#modal textarea{width:100%;font-family:var(--mono);font-size:13px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 4px;font-size:15px}.kv span:nth-child(odd){color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mini.pal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:68px;color:var(--ink);line-height:1.1}
.mini.pal small{font-size:11px;font-weight:500;color:var(--ink2)}
.mini.pal b{font-size:16px}
.chip.btn{cursor:pointer;font-family:inherit}
.chip.btn:active{transform:scale(.97)}
.stg{display:grid;grid-template-columns:1fr;gap:8px;margin-top:2px}
.stt{position:relative;display:block;padding:12px 44px 12px 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);text-align:left;overflow:hidden}
.stt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sc)}
.stt::after{content:'';position:absolute;right:14px;top:50%;width:20px;height:20px;margin-top:-11px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.stt[aria-pressed="true"]::after{content:'✓';border-color:var(--bg);background:var(--bg);color:var(--ink);font-size:13px;font-weight:800;line-height:16px;text-align:center}
.stt b{display:block;font-size:18px;line-height:1.15}
.stt small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.stt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stt[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.bigbtn.off{opacity:.45}
.tabs button{padding:10px 2px;font-size:14px;min-width:0}
.toolc{padding:12px 14px}
.toolhd{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.toolhd b{display:block;font-size:15px}
.toolhd small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.toolhd .lnk{margin-left:0;white-space:nowrap;font-size:13px;color:var(--ink2)}
</style>
</head>
<body>

<div id="app"></div>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var hm=function(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
var ymd=function(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var hms=function(ms){ms=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(ms/3600))+':'+pad(Math.floor(ms%3600/60))+':'+pad(ms%60)};
var iso=function(t){var d=new Date(t);return ymd(t)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};

/* ---------- состояние ---------- */
var LS='lean.shift.v2';
var CFG_DEF={goal:60,people:1,avail:450,days:5,upd:0};
var S={shifts:{},activeId:null,op:'',ord:'',mat:'',oid:'',dirty:{},lang:'fi',orders:{},cfg:null,st:'',stf:'',opf:'',known:{}};
var UI={tab:'shift',viewId:null,modal:null,toast:null,sync:'local',wake:false,ed:true,fb:false,user:null};
var DB=null,DL=null,UNDO=null,SAMPLES={},tickN=0;
try{var raw=localStorage.getItem(LS);if(raw){var p=JSON.parse(raw);if(p&&p.shifts)S=Object.assign(S,p)}}catch(e){}
if(!S.orders)S.orders={};
if(!S.known)S.known={};
if(!S.dirty)S.dirty={};
Object.keys(S.shifts).forEach(function(k){var x=S.shifts[k];if(!(x&&Array.isArray(x.ev)&&x.ev.length&&Array.isArray(x.sh))){delete S.shifts[k];delete S.dirty[k]}});
if(!S.cfg)S.cfg=Object.assign({},CFG_DEF);
if(S.st!=='cnc'&&S.st!=='kok'&&S.st!=='pak')S.st='';
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function lg(){return S.lang==='ru'?'ru':'fi'}

/* ---------- тексты интерфейса: [ru, fi] ---------- */
var TR={
 brand:['Lean-смена','Lean-vuoro'],
 sy_ok:['в облаке ✓','pilvessä ✓'],sy_busy:['синхронизация…','synkronoidaan…'],sy_err:['нет связи','ei yhteyttä'],sy_loc:['только здесь','vain laitteella'],
 tab_shift:['Смена','Vuoro'],tab_sum:['Итоги','Yhteenveto'],tab_hist:['История','Historia'],tab_ord:['Заказы','Tilaukset'],tab_trend:['Тренды','Trendit'],
 trend_h:['Тренды по всем сменам','Kaikkien vuorojen trendit'],
 trend_range:[function(n,a,b){return n+' смен · '+a+' — '+b},function(n,a,b){return n+' vuoroa · '+a+' — '+b}],
 trend_span:[function(a,b){return 'Разброс VA% по сменам: от '+a+'% до '+b+'%'},function(a,b){return 'Vuorojen VA%-vaihteluväli: '+a+'–'+b+'%'}],
 trend_days_h:['VA % по сменам','VA % vuoroittain'],
 trend_none:['Пока нет ни одной смены.','Ei vielä yhtään vuoroa.'],
 trend_wk_h:['Тренд по неделям (13 недель ≈ 3 мес.)','Viikkotrendi (13 viikkoa ≈ 3 kk)'],
 trend_wk_note:['Каждая точка — доля VA/NVA/Hukka за неделю. Разрыв линии — недель без данных.','Jokainen piste on VA/NVA/Hukka-osuus viikossa. Katkos viivassa — viikko ilman dataa.'],
 trend_chart_alt:['График доли VA/NVA/Hukka по неделям','VA/NVA/Hukka-osuuksien viikkokaavio'],
 csv_vsm:['CSV: для vsmdata (лист «Данные»)','CSV: vsmdata-taulukkoon («Data»-välilehti)'],
 ord_h:['Заказы','Tilaukset'],
 ord_new:['+ Новый заказ','+ Uusi tilaus'],

/* Режимы: Supabase (GitHub Pages; config.js) → вход админа по почте+паролю, остальные по инициалам (+PIN);
   артефакт Claude → его база; иначе только localStorage. Все режимы дают один API:
   DB.collection(x).orderBy().limit().onSnapshot(), DB.doc('c/id').set()/delete() */
var ftimer=null,writing=false,UNSUB=[],SUPA=null,SESS=null,SHIFT_LIMIT=600,SESS_K='lean.sess.v1';

function setSync(v){UI.sync=v;var el=$('#sync');if(el){el.className='chip'+(v==='ok'?' ok':(v==='err'||v==='auth')?' err':'');el.textContent=syncText()}}
function touch(sh){sh.upd=Date.now();S.dirty[sh.id]='set';save();scheduleFlush(700)}
function scheduleFlush(ms){if(!DB)return;clearTimeout(ftimer);ftimer=setTimeout(flush,ms)}
function isDenied(e){var c=e&&e.code;return c==='permission-denied'||c==='not_granted'||c==='invalid_argument'||c==='capability_disabled'||c==='unauthenticated'}
async function flush(){
  if(!DB||writing)return;
  if(UI.fb&&!UI.user){setSync('auth');return}
  writing=true;setSync('busy');var failed=false;
  try{
    var ids=Object.keys(S.dirty);
    for(var i=0;i<ids.length;i++){
      var id=ids[i],op=S.dirty[id],ref,val,adm=false;
      if(id==='cfg'){ref=DB.doc('settings/takt');val=S.cfg;adm=true}
      else if(id==='tm'){ref=DB.doc('settings/toolmap');val=S.toolmap;adm=true}
      else if(id.indexOf('ord:')===0){ref=DB.doc('orders/'+id.slice(4));val=S.orders[id.slice(4)];adm=true}
      else{ref=DB.doc('shifts/'+id);val=S.shifts[id]}
      try{if(op==='del'){await ref.delete()}else if(val){await ref.set(clone(val))}}
      catch(we){if(adm&&isDenied(we)){delete S.dirty[id];toast(t('ro_saved'));continue}throw we}

async function authFetch(path,opt){

  /* publishable key — не JWT: уходит только как apikey; Authorization несёт токен пользователя */
  var h=Object.assign({apikey:SB_KEY},opt.headers||{});if(SESS&&SESS.at)h.Authorization='Bearer '+SESS.at;
  var r=await fetch(SB_URL+path,Object.assign({},opt,{headers:h}));

function makeSupa(){
  var subs=[];
  async function pull(sub){
    try{var r=await authFetch('/rest/v1/'+sub.c+'?select=id,data&order=updated_at.desc&limit='+sub.lim);if(!r.ok)throw sbErr(r);
      var rows=await r.json();if(subs.indexOf(sub)<0)return;
      sub.cb({docs:rows.map(function(x){return{id:x.id,exists:true,data:function(){return x.data}}})})}
    catch(e){if(sub.err)sub.err(e)}
  }
  function pollAll(){subs.slice().forEach(pull)}
  setInterval(function(){if(document.visibilityState==='visible')pollAll()},20000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')pollAll()});
  window.addEventListener('online',pollAll);
  return{
    doc:function(p){var i=p.indexOf('/'),c=p.slice(0,i),id=p.slice(i+1);return{
      set:async function(v){var r=await authFetch('/rest/v1/'+c+'?on_conflict=id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:id,data:v,updated_at:new Date().toISOString()}])});if(!r.ok)throw sbErr(r)},
      delete:async function(){var r=await authFetch('/rest/v1/'+c+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});if(!r.ok)throw sbErr(r)}}},
    collection:function(c){var q={c:c,lim:1000};var o={orderBy:function(){return o},limit:function(n){q.lim=n;return o},onSnapshot:function(cb,err){var s={c:q.c,lim:q.lim,cb:cb,err:err};subs.push(s);pull(s);return function(){var k=subs.indexOf(s);if(k>=0)subs.splice(k,1)}}};return o},
    pollAll:pollAll
  };
}

function attach(){
  var firstS=true,firstO=true;

    var ch=false,remote={};

      if(!d.exists)return;var r=d.data();if(!okShift(r))return;remote[d.id]=1;S.known[d.id]=1;var l=S.shifts[d.id];
      if(S.dirty[d.id])return;
      if(!l||(r.upd||0)>(l.upd||0)){S.shifts[d.id]=clone(r);ch=true}
    });
    /* смена есть у нас, но нет в базе: если мы её уже видели в базе — её удалили на другом устройстве, иначе она новая и её надо отправить */
    if(snap.docs.length<SHIFT_LIMIT&&!(snap.docs.length===0&&Object.keys(S.known).length>3)){
      Object.keys(S.shifts).forEach(function(id){
        if(remote[id]||S.dirty[id])return;
        if(S.known[id]){delete S.shifts[id];delete S.known[id];ch=true}else S.dirty[id]='set';

    }
    if(firstS){firstS=false}
    if(S.activeId&&(!S.shifts[S.activeId]||S.shifts[S.activeId].end)){S.activeId=null;ch=true}
    save();scheduleFlush(300);
    if(ch&&!UI.modal)render();
    if(!Object.keys(S.dirty).length)setSync('ok');
  },function(e){setSync(isDenied(e)?'auth':'err')});
  sub(DB.collection('orders'),function(snap){
    var ch=false,remote={};
    snap.docs.forEach(function(d){
      if(!d.exists)return;var r=d.data();remote[d.id]=1;S.known['ord:'+d.id]=1;var l=S.orders[d.id];
      if(S.dirty['ord:'+d.id])return;
      if(!l||(r.upd||0)>(l.upd||0)){S.orders[d.id]=clone(r);ch=true}
    });
    Object.keys(S.orders).forEach(function(id){
      var k='ord:'+id;if(remote[id]||S.dirty[k])return;
      if(S.known[k]){delete S.orders[id];delete S.known[k];ch=true}else if(UI.ed)S.dirty[k]='set';
    });
    if(firstO){firstO=false}

    if(ch&&!UI.modal)render();
  },function(e){setSync(isDenied(e)?'auth':'err')});
  sub(DB.collection('settings'),function(snap){

      if(!d.exists)return;var r=d.data();
      if(d.id==='toolmap'&&!S.dirty.tm){if(!S.toolmap||(r.upd||0)>(S.toolmap.upd||0)){S.toolmap=clone(r);ch=true}}

    });
    if(ch){save();if(!UI.modal)render()}
  },function(){});
  setSync(Object.keys(S.dirty).length?'busy':'ok');render();
}

/* ---------- операции смены ---------- */
function feedback(){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function snapshot(){var sh=active();UNDO=sh?JSON.stringify(sh):null}
function toast(text,undo){UI.toast={text:text,undo:!!undo};renderToast();clearTimeout(toast.t);toast.t=setTimeout(function(){UI.toast=null;renderToast()},6000)}
function startShift(op,ord,mat,oid,st){

/* перейти на другой участок: текущая смена закрывается, сразу открывается новая (оператор и заказ те же) */
function switchStation(to){

/* Брак/переделка: заказ и материал берём из заметки, а не из текущего заказа — иначе переделка попадает в тот заказ, который сейчас в работе */
function normTxt(x){return String(x||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'')}
function defectCands(){
  var os=[],ms=[],sO={},sM={};
  Object.keys(S.orders).forEach(function(id){var o=S.orders[id];if(!o||!o.name)return;os.push({name:o.name,oid:id});sO[normTxt(o.name)]=1;
    (o.mats||[]).forEach(function(x){var m=String(x.m||'').replace(/\s*·\s*(МДФ|ДСП)$/,''),n=normTxt(m);if(n&&!sM[n]){sM[n]=1;ms.push(m)}})});
  Object.keys(S.shifts).forEach(function(k){var sh=S.shifts[k];if(!sh||!sh.ev)return;sh.ev.forEach(function(e){
    if(e.o){var n=normTxt(e.o);if(n&&!sO[n]){sO[n]=1;os.push({name:e.o,oid:''})}}
    if(e.m){var nm=normTxt(e.m);if(nm&&!sM[nm]){sM[nm]=1;ms.push(e.m)}}})});
  return{os:os,ms:ms};
}
function parseDefectCtx(note){
  var out={o:'',m:'',oid:''};if(!note)return out;
  var nn=normTxt(note),c=defectCands(),best=0,hit=null;
  c.os.forEach(function(x){
    var full=normTxt(x.name),sc=0;
    if(full.length>=4&&nn.indexOf(full)>=0)sc=full.length;
    else if(x.oid){var seg=normTxt(x.name.split(/[_\s\-]+/)[0]);if(seg.length>=6&&nn.indexOf(seg)>=0)sc=seg.length}
    if(sc&&(sc>best||(sc===best&&hit&&!hit.oid&&x.oid))){best=sc;hit=x}
  });
  if(hit){out.o=hit.name;out.oid=hit.oid}
  var bm='',bl=0;
  c.ms.forEach(function(m){var n=normTxt(m);if(n.length>=3&&n.length>bl&&nn.indexOf(n)>=0){bm=m;bl=n.length}});
  if(!bm){var ws=String(note).split(/[\s,;:()\/]+/);for(var i=0;i<ws.length;i++){var w=ws[i].replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'');if(w.length>=3&&matRules(w).length){bm=w;break}}}
  out.m=bm;return out;
}
/* заказ в работе: контекст последнего события, не относящегося к браку (dc) */
function workCtx(sh){var i=sh.ev.length-1;while(i>0&&sh.ev[i].dc)i--;var e=sh.ev[i];return{o:e.o||'',m:e.m||'',oid:e.oid||''}}
function mkEv(sh,t0,s,r,cx){var e={t:t0,s:s,r:r||null,o:cx.o||'',oid:cx.oid||''};if(shSt(sh)==='cnc')e.m=cx.m||'';return e}
function setState(k,r,note,tl,src){
  var sh=active();if(!sh)return;var cur=last(sh);snapshot();var auto=false,cnc=shSt(sh)==='cnc';useSt(shSt(sh));
  var cx,dc=false;
  if(cnc&&k==='defect'){cx=parseDefectCtx(note);dc=true}
  else if(cur.dc&&k==='work'&&r==='rw'){cx={o:cur.o,m:cur.m,oid:cur.oid};dc=true}
  else if(cur.dc){cx=workCtx(sh)}
  else cx={o:cur.o,m:cur.m,oid:cur.oid};
  if(cur.s===k&&(r||null)===(cur.r||null)){
    if(note)cur.n=note;else if(!tl&&cnc)delete cur.n;if(tl)cur.tl=tl;if(src)cur.src=src;
    if(cnc&&k==='defect'){cur.o=cx.o;cur.m=cx.m;cur.oid=cx.oid;cur.dc=1}}
  else if(cur.s===k){
    /* тот же статус, но другая причина — новый случай, не затираем прежнюю заметку */
    var e2=mkEv(sh,Math.max(Date.now(),cur.t+1),k,r,cx);if(dc)e2.dc=1;if(note)e2.n=note;if(tl)e2.tl=tl;if(src)e2.src=src;sh.ev.push(e2)}
  else{
    if(needAuto(sh,k,r)){sh.sh.push({t:Date.now(),o:cur.o,m:cur.m,oid:cur.oid,a:1});auto=true}
    var e=mkEv(sh,Math.max(Date.now(),cur.t+1),k,r,cx);if(dc)e.dc=1;if(note)e.n=note;if(tl)e.tl=tl;if(src)e.src=src;sh.ev.push(e)}
  touch(sh);feedback();
  toast(t('rec')+sn(SMAP[k])+(r?' · '+rname(k,r):'')+(tl?' · '+tl:'')+(src?' · '+srcName(src):'')+(cnc&&k==='defect'?' · '+(cx.o||cx.m?[cx.o,cx.m].filter(Boolean).join(' · '):t('ord_unset')):'')+(auto?t('sheet_auto',sh.sh.length):''),true);render();
}
function workRunStart(sh){var i=sh.ev.length-1;while(i>0&&sh.ev[i-1].s==='work')i--;return sh.ev[i].t}
/* Работа → логистика или установка листа, а за этот проход лист не отмечен: считаем лист готовым */
function needAuto(sh,k,r){
  if(shSt(sh)!=='cnc')return false;var cur=last(sh);if(cur.s!=='work'||cur.r==='rw')return false;
  if(!(k==='log'||(k==='prep'&&r==='sheet')))return false;
  var t0=workRunStart(sh);if(Date.now()-t0<180000)return false;

}
function setNote(v){var sh=active();if(!sh)return;var cur=last(sh);snapshot();if(v)cur.n=v;else delete cur.n;if(shSt(sh)==='cnc'&&cur.s==='defect'){var c2=parseDefectCtx(v);cur.o=c2.o;cur.m=c2.m;cur.oid=c2.oid;cur.dc=1}touch(sh);toast(t('note_saved'),true);render()}
function toggleRw(){var sh=active();if(!sh)return;var cur=last(sh);if(cur.s!=='work')return;snapshot();cur.r=cur.r==='rw'?null:'rw';if(cur.dc&&cur.r!=='rw'){var wc=workCtx(sh);cur.o=wc.o;cur.m=wc.m;cur.oid=wc.oid;delete cur.dc}touch(sh);feedback();if(cur.r==='rw')toast(t('rw_on'),true);render()}

function parseOrderMats(txt){

/* время и материалы, фактически потраченные на заказ — по привязке oid в событиях смен */
function orderStats(oid){
  var now=Date.now(),cls={VA:0,NVA:0,Hukka:0},byMat={},tr=0,area=0,by={cnc:{tr:0,va:0,n:0,pal:0},kok:{tr:0,va:0,n:0,pal:0}};
  realShifts().forEach(function(sh){
    var st=shSt(sh);
    segs(sh,now).forEach(function(x){
      if(x.oid!==oid||x.s==='break')return;
      if(x.s==='area'){area+=x.d;return}
      var c=clsOf(x);cls[c]+=x.d;tr+=x.d;by[st].tr+=x.d;if(c==='VA')by[st].va+=x.d;
      if(st==='cnc'){var mk=x.m||t('nomat');byMat[mk]=(byMat[mk]||0)+x.d}
    });
    sh.sh.forEach(function(c){if(c.oid===oid)by[st].n++});
    (sh.pl||[]).forEach(function(c){if(c.oid===oid)by[st].pal++});
  });
  return{cls:cls,tr:tr,byMat:byMat,area:area,by:by};
}

  var ns=0,no=0,nset=0,shs=j.shifts||{},ors=j.orders||{},se=j.settings||{};
  (Array.isArray(shs)?shs:Object.keys(shs).map(function(k){return shs[k]})).forEach(function(o){
    if(!okShift(o)||!o.id)return;var l=S.shifts[o.id];if(l&&(l.upd||0)>=(o.upd||0))return;
    S.shifts[o.id]=clone(o);S.dirty[o.id]='set';ns++});

var VSM_NORM={coffee:15,lunch:30};
function dmy(d){var p=(d||'').split('-');return p.length===3?(p[2]+'.'+p[1]+'.'+p[0].slice(2)):d}
function vsmCat(x){
  if(x.s==='work')return x.r==='rw'?'Брак/переделка':'Обработка (VA)';
  if(x.s==='prep')return(x.r==='sheet'||x.r==='clean'||x.r==='s5')?'Подготовка материала':'Наладка/программирование';
  if(x.s==='log')return'Логистика/склад';
  if(x.s==='defect')return'Брак/переделка';
  if(x.s==='misc')return x.r==='meeting'?'Собрание':x.r==='unplanned'?'Незапланированная задача':'Посторонняя задача';
  if(x.s==='wait')return'Простой оборудования';
  if(x.s==='break')return x.r==='lunch'?'Обед':'Регламентный перерыв';
  if(x.s==='area')return'Работа на другом участке';
  return'Наладка/программирование';
}
function vsmRows(sh,dayIdx,now){
  var out=[],sg=segs(sh,now);
  sg.forEach(function(x){
    var min=Math.round(x.d/60000),desc=(x.r?rname(x.s,x.r,x.st):sn(smOf(x.st,x.s)))+(x.n?' — '+x.n:''),va=clsOf(x)==='VA'?'Да':'Нет',reason=(x.s==='defect'||x.s==='wait')&&x.r?rname(x.s,x.r,x.st):'';
    if(x.s==='break'&&x.r==='coffee'&&min>VSM_NORM.coffee){
      out.push([dmy(sh.date),hm(x.a),'',VSM_NORM.coffee,desc,'Регламентный перерыв','',x.m||'','','','','','Нет',dayIdx]);
      out.push([dmy(sh.date),'',hm(x.b),min-VSM_NORM.coffee,desc+' (сверх нормы)','Доп. перерыв (сверх нормы)','',x.m||'','','','','','Нет',dayIdx]);
      return;
    }
    out.push([dmy(sh.date),hm(x.a),hm(x.b),min,desc,vsmCat(x),reason,x.m||'','','','','',va,dayIdx]);
  });
  return out;
}

  }else{

      var prev=null,k=shSt(sh)==='cnc'?'levy':'kaappi';

    });
  }
  try{await DL.save({filename:fn+'_'+ymd(now)+'.csv',data:toCsv(rows)})}
  catch(e){if(!e||e.code!=='declined')toast(t('dl_fail'))}
}

/* ---------- фильтры списков: участок и исполнитель ---------- */
function fSt(){var f=S.stf;return(SETS[f]||f==='all')?f:(S.st||'all')}
function stShifts(){var f=fSt();return realShifts().filter(function(s){return f==='all'||shSt(s)===f})}
function opKey(o){return String(o||'').trim().toUpperCase()}
function opList(){var seen={},out=[];stShifts().forEach(function(s){var k=opKey(s.op);if(k&&k!=='—'&&!seen[k]){seen[k]=1;out.push(k)}});return out.sort()}
function opFilter(){var f=S.opf;return(f&&opList().indexOf(f)>=0)?f:''}
function fShifts(){var l=stShifts(),f=opFilter();return f?l.filter(function(s){return opKey(s.op)===f}):l}
function fltHtml(){
  var ops=opList(),f=fSt();
  var row1='<div class="chips" style="margin-top:0">'+[['all',t('f_all')]].concat(STN.map(function(k){return [k,stShort(k)]})).map(function(x){return '<button data-act="stf" data-s="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+esc(x[1])+'</button>'}).join('')+'</div>';
  var row2=ops.length?'<h4 style="margin:14px 0 8px">'+t('flt_h')+'</h4><div class="chips" style="margin-top:0">'+[''].concat(ops).map(function(o){return '<button data-act="opf" data-o="'+esc(o)+'" aria-pressed="'+(opFilter()===o)+'">'+(o?esc(o):t('flt_all'))+'</button>'}).join('')+'</div>':'';
  return '<section class="card"><h4>'+t('st_h')+'</h4>'+row1+row2+'</section>';
}
function nUnits(sh,n){return shSt(sh)!=='cnc'?t('n_cabs',n):t('n_sheets',n)}

function summaryAll(list,now){
  var cls={VA:0,NVA:0,Hukka:0},byR={},bySrc={},days=[];
  list.forEach(function(sh){
    var m=summary(sh,now),tr=m.cls.VA+m.cls.NVA+m.cls.Hukka;
    cls.VA+=m.cls.VA;cls.NVA+=m.cls.NVA;cls.Hukka+=m.cls.Hukka;
    Object.keys(m.byR).forEach(function(k){byR[k]=(byR[k]||0)+m.byR[k]});
    Object.keys(m.bySrc).forEach(function(k){bySrc[k]=(bySrc[k]||0)+m.bySrc[k]});
    days.push({id:sh.id,start:sh.start,va:tr>0?m.cls.VA/tr:null,open:!sh.end,n:m.n,st:shSt(sh)});
  });
  var tracked=cls.VA+cls.NVA+cls.Hukka;
  days.sort(function(a,b){return a.start-b.start});
  return{cls:cls,tracked:tracked,par:parList(byR,8),bySrc:bySrc,days:days,n:list.length};
}

  var c=S.cfg,tk=taktMin(),a=taktActual();

  var mm=function(v){var r=Math.round(v*10)/10;return (lg()==='ru'?String(r).replace('.',','):String(r))+' min'};
  var pill=function(v){return v>tk?'<span class="chip err">'+t('takt_over')+'</span>':'<span class="chip ok">'+t('takt_ok')+'</span>'};
  var act=a.cabs?'<div class="kv"><span>'+t('takt_act')+'</span><span><b class="mono">'+mm(a.gross/60000)+'</b> '+pill(a.gross/60000)+'</span>'
    +(a.net?'<span>'+t('takt_net')+'</span><span><b class="mono">'+mm(a.net/60000)+'</b> '+pill(a.net/60000)+'</span>':'')+'</div><p class="muted" style="margin:4px 0 0;font-size:13px">'+t('takt_basis',a.n,a.cabs)+'</p>'
    :'<p class="muted" style="margin:10px 0 0">'+t('takt_none')+'</p>';
  return '<section class="card"><h4>'+bi('takt_h')+'</h4><div class="ctx" style="margin-top:0">'+fld('tk-goal','goal','takt_goal')+fld('tk-people','people','takt_people')+fld('tk-avail','avail','takt_avail')+fld('tk-days','days','takt_days')+'</div>'
   +'<div class="kpis" style="grid-template-columns:1fr;margin-top:12px"><div class="kpi"><span class="kl">'+t('takt_val')+'</span><b>'+mm(tk)+'</b></div></div>'
   +act+(UI.ed?'':'<p class="muted" style="margin:10px 0 0;font-size:13px">'+t('ro_note')+'</p>')+'<p class="muted" style="margin:10px 0 0;font-size:13px">'+t('takt_note')+'</p></section>';

function viewTrend(){
  var now=Date.now(),list=fShifts(),f=fSt();useSt(f==='all'?'cnc':f);

   +'<div class="wklegend"><span><i style="background:var(--c-work)"></i>VA</span><span><i style="background:var(--c-log)"></i>NVA</span><span><i style="background:var(--c-wait)"></i>Hukka</span></div>'
   +'<p class="muted" style="margin:8px 0 0;font-size:13px">'+t('trend_wk_note')+'</p></section>';

   +(vas.length>1?'<p class="muted" style="margin:10px 0 0">'+t('trend_span',Math.round(vmin*100),Math.round(vmax*100))+'</p>':'')+'</section>';

function weekStart(ts){var d=new Date(ts);var day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d.getTime()}
function wklabel(ts){return new Date(ts).toLocaleDateString(lg()==='ru'?'ru-RU':'fi-FI',{day:'2-digit',month:'2-digit'})}
function summaryByWeek(list,now,weeks){
  weeks=weeks||13;
  var curW=weekStart(now),buckets=[],byWk={};
  /* недели считаем по календарю, а не по 7×24 ч: при переходе на зимнее/летнее время сутки бывают 23 или 25 ч */
  for(var i=weeks-1;i>=0;i--){var dw=new Date(curW);dw.setDate(dw.getDate()-7*i);var b={wk:weekStart(dw.getTime()),cls:{VA:0,NVA:0,Hukka:0},n:0};buckets.push(b);byWk[b.wk]=b}
  list.forEach(function(sh){
    var b=byWk[weekStart(sh.start)];if(!b)return;
    var m=summary(sh,now);
    b.cls.VA+=m.cls.VA;b.cls.NVA+=m.cls.NVA;b.cls.Hukka+=m.cls.Hukka;b.n+=m.n;
  });
  return buckets;
}
/* строит один или несколько <path> для линии, разрывая её на неделях без данных (getY возвращает null) */
function linePath(buckets,x,getY){
  var segs=[],cur=[];
  buckets.forEach(function(b,i){
    var y=getY(b);
    if(y==null){if(cur.length>1)segs.push(cur);cur=[];return}
    cur.push([x(i),y]);
  });
  if(cur.length>1)segs.push(cur);
  return segs.map(function(seg){return'<path d="M'+seg.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L')+'" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>'}).join('');
}
function dots(buckets,x,getY,r){
  r=r||2.6;
  return buckets.map(function(b,i){var y=getY(b);if(y==null)return'';return'<circle cx="'+x(i).toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'"></circle>'}).join('');
}
function weekChart(buckets){
  var W=680,H=170,padT=10,padB=20,padX=6,n=buckets.length,hFull=H-padT-padB,y0=H-padB;
  var x=function(i){return n>1?padX+i*(W-2*padX)/(n-1):W/2};
  function frac(b,cls){var tr=b.cls.VA+b.cls.NVA+b.cls.Hukka;return tr>0?b.cls[cls]/tr:null}
  function yOf(cls){return function(b){var f=frac(b,cls);return f==null?null:padT+(1-f)*hFull}}
  var grid='<line x1="'+padX+'" y1="'+(padT+hFull/2).toFixed(1)+'" x2="'+(W-padX)+'" y2="'+(padT+hFull/2).toFixed(1)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>';
  var series=['VA','NVA','Hukka'].map(function(cls,ci){
    var color=cls==='VA'?'var(--c-work)':cls==='NVA'?'var(--c-log)':'var(--c-wait)';
    return'<g stroke="'+color+'" fill="'+color+'">'+linePath(buckets,x,yOf(cls))+dots(buckets,x,yOf(cls))+'</g>';
  }).join('');
  var labels=buckets.map(function(b,i){
    if(i%2!==0&&i!==n-1)return'';
    return'<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" fill="var(--ink2)">'+wklabel(b.wk)+'</text>';
  }).join('');
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(t('trend_chart_alt'))+'">'+grid+series+labels+'</svg>';
}

    case 'stsw-do':switchStation(b.dataset.id);break;
    case 'login':UI.modal={type:'login',mode:'ini'};renderModal();break;
    case 'logmode':UI.modal={type:'login',mode:b.dataset.m};renderModal();break;
    case 'logindo':doLogin();break;
    case 'ppnew':if(!UI.ed)break;UI.modal={type:'person'};renderModal();break;
    case 'ppedit':if(!UI.ed)break;UI.modal={type:'person',ini:b.dataset.i};renderModal();break;
    case 'ppsave':if(UI.ed)doSavePerson(b.dataset.i);break;
    case 'ppaskdel':UI.modal={type:'confirm',title:t('pp_del_q'),text:t('pp_del_t'),ok:t('pp_del'),act:'ppdel-do',id:b.dataset.i};renderModal();break;
    case 'ppdel-do':if(!UI.ed)break;UI.modal=null;renderModal();deletePerson(b.dataset.id);break;
    case 'logask':UI.modal={type:'confirm',title:t('logout_q'),text:(UI.user?UI.user.email+'. ':'')+t('logout_t'),ok:t('logout_b'),act:'logout-do'};renderModal();break;
    case 'logout-do':UI.modal=null;logoutNow();render();break;
    case 'migpick':var mf=$('#mig-file');if(mf)mf.click();break;
    case 'ordpick':UI.modal={type:'ordpick'};renderModal();break;
    case 'ordpicksel':
      var poid=b.dataset.id;
      if(!poid){UI.modal=null;applyOrderPick('','','');render();break}
      var pord=S.orders[poid];if(!pord){UI.modal=null;render();break}
      var pmats=(curSt()==='cnc')?(pord.mats||[]):[];
      if(pmats.length<=1){UI.modal=null;applyOrderPick(pord.name,pmats.length?pmats[0].m:'',poid);render()}
      else{UI.modal={type:'ordpickmat',oid:poid};renderModal()}
      break;
    case 'ordpickmatsel':
      var pmoid=UI.modal.oid,pmord=S.orders[pmoid],pmi=+b.dataset.i;
      UI.modal=null;applyOrderPick(pmord.name,pmord.mats[pmi]?pmord.mats[pmi].m:'',pmoid);render();break;
    case 'ordnew':if(!UI.ed)break;UI.modal={type:'ordedit'};renderModal();break;
    case 'ordopen':UI.modal={type:'ordedit',id:b.dataset.id};renderModal();break;
    case 'ordsave':
      if(!UI.ed)break;
      var onm=($('#ord-name').value||'').trim();
      if(!onm){toast(t('ord_need_name'));break}
      var okk=parseInt($('#ord-cabs').value,10)||0,omats=parseOrderMats($('#ord-mats').value),oid3=b.dataset.id;
      var oldM=(oid3&&S.orders[oid3]&&S.orders[oid3].mats)||[];
      omats.forEach(function(x){if(oldM.some(function(y){return y.nb&&y.m===x.m}))x.nb=1});
      UI.draft={id:oid3||'',name:onm,k:okk,mats:omats};
      var vi=veneerNoBase(omats);
      if(vi>=0){UI.modal={type:'baseq',i:vi};renderModal();break}
      finishOrderSave();break;
    case 'baseset':
      var bd=UI.draft;if(!bd){UI.modal=null;render();break}
      var bm=bd.mats[UI.modal.i],bv=b.dataset.v;
      if(bv==='mdf')bm.m=bm.m+' · МДФ';else if(bv==='dsp')bm.m=bm.m+' · ДСП';else bm.nb=1;
      var vn=veneerNoBase(bd.mats);
      if(vn>=0){UI.modal={type:'baseq',i:vn};renderModal()}else finishOrderSave();
      break;
    case 'orddone':if(!UI.ed)break;var odn=S.orders[b.dataset.id];if(odn){odn.done=!odn.done;orderSave(odn)}UI.modal=null;render();break;
    case 'ordaskdel':UI.modal={type:'confirm',title:t('ord_del_q'),text:t('ord_del_t'),ok:t('ord_del'),act:'orddel-do',id:b.dataset.id};renderModal();break;
    case 'orddel-do':if(!UI.ed)break;delOrder(b.dataset.id);UI.modal=null;render();break;
    case 'wake':toggleWake();break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='st-op'){S.op=(el.value||'').trim();save()}
  else if(el.dataset&&el.dataset.cfg&&UI.ed){setCfg(el.dataset.cfg,el.value)}
  else if(el.id==='mig-file'&&UI.ed){var f=el.files&&el.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){importMigration(String(rd.result||''))};rd.readAsText(f)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal()}
  if(e.key==='Enter'&&e.target.id==='in-note3'){var b3=$('[data-act="notesave"]');if(b3)b3.click()}
  if(e.key==='Enter'&&e.target.id==='in-note'){var b=$('[data-act="note"]');if(b)b.click()}
  if(e.key==='Enter'&&(e.target.id==='lg-pw'||e.target.id==='lg-em'||e.target.id==='lg-ini'||e.target.id==='lg-pin')){var b4=$('[data-act="logindo"]');if(b4)b4.click()}
});
window.addEventListener('online',function(){scheduleFlush(0)});

/* ---------- экран не гаснет ---------- */
var wl=null;
async function toggleWake(){
  if(UI.wake){try{if(wl)await wl.release()}catch(e){}wl=null;UI.wake=false}
  else{try{wl=await navigator.wakeLock.request('screen');UI.wake=true}catch(e){toast(t('wake_fail'))}}
  render();
}
document.addEventListener('visibilitychange',function(){
  if(UI.wake&&document.visibilityState==='visible'&&navigator.wakeLock)navigator.wakeLock.request('screen').then(function(x){wl=x}).catch(function(){});
});

/* ---------- таймер ---------- */
setInterval(function(){
  var sh=active();tickN++;
  if(sh){var tm=$('#timer');if(tm)tm.textContent=hms(Date.now()-stateStart(sh));var a=$('#ago');if(a)a.textContent=agoText(sh)}
  if(tickN%30===0&&UI.tab==='sum'&&!UI.modal){var v=viewShift();if(v&&!v.end)render()}
},1000);

render();
initDb();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!window.__noSW)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
